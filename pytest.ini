[pytest]
testpaths = tests
python_files = test_*.py
; pytest-qt's plugin auto-loads QtGui at collection time, which needs a
; working OpenGL/EGL stack. Headless CI/build boxes without a display
; server won't have one, so the plugin is disabled by default here; the
; small number of GUI smoke tests opt back in explicitly (see
; tests/test_ui_smoke.py) by being run with `-p qt` locally / on a
; machine with a display.
addopts = -p no:qt
