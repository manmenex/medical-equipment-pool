name: CI

# Roadmap infrastructure PR (pre-PR7): reliable GitHub CI checks for pull
# requests targeting the base branch. See docs/AI_REVIEW_WORKFLOW.md for how
# these checks fit into the Claude -> Codex -> owner review workflow.
#
# Every job uses test-only, hardcoded, non-secret values (POSTGRES_*,
# JWT_SECRET_KEY is left at the backend's own committed development default —
# see backend/app/core/config.py) and a PostgreSQL service container. No
# repository secret, hospital credential, or production configuration is
# read or required for this workflow to run.

on:
  pull_request:
    branches:
      - claude/medical-equipment-pool-0c7fz0

# Least privilege: this workflow only ever reads the repository and runs
# tests/builds. No job needs to write repository contents, mutate the pull
# request, use a repository secret, or auto-merge -- so the default
# GITHUB_TOKEN is read-only at the workflow level, and no job below
# overrides it with broader permissions.
permissions:
  contents: read

# Cancel a still-running run for the same PR when a new commit is pushed,
# so CI reflects only the latest reviewed head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Matches backend/Dockerfile's production image (the only explicit
  # Python version declaration in this repository).
  PYTHON_VERSION: "3.12"
  # Matches this repository's frontend/package-lock.json-resolved toolchain.
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend tests (non-PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Roadmap PR18D: WeasyPrint (the backend PDF renderer, exercised by
      # app.api.v1.reports's PDF export tests) loads Pango/HarfBuzz at
      # runtime via cffi, not via a pip wheel -- matches the native packages
      # backend/Dockerfile installs for the production image.
      - name: Install WeasyPrint native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # tests/conftest.py sets DATABASE_URL to an in-memory SQLite database
      # and CACHE_ENABLED=false via os.environ.setdefault(...) before the
      # app is imported, so no environment configuration is needed here.
      # This is the repository's documented, supported non-PostgreSQL test
      # command (see docs/PROJECT_PLAYBOOK.md evidence conventions and every
      # Roadmap PR's own evidence table).
      - name: Run backend tests (non-PostgreSQL)
        run: python -m pytest -q -m "not postgres"

  backend-postgres-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Test-only credentials, hardcoded here (not a repository secret)
          # and scoped to this ephemeral CI service container only.
          POSTGRES_DB: mep_test_db
          POSTGRES_USER: mep_test
          POSTGRES_PASSWORD: mep_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mep_test -d mep_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Roadmap PR18D: see the matching step in the backend-tests job above.
      - name: Install WeasyPrint native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # Fail closed, before pytest ever runs: tests/test_postgres_integration.py's
      # own fixtures call pytest.skip() whenever PostgreSQL is unreachable/unusable
      # or the scratch-database privilege those migration round-trip tests need is
      # missing -- so a broken service container can otherwise make the suite below
      # exit 0 via silent skips instead of failures. This does not use pg_isready:
      # pg_isready only proves the server process accepts TCP connections, not that
      # these exact credentials can authenticate, reach the configured database, or
      # create/drop a database. See scripts/postgres_ci_gate.py.
      - name: Verify PostgreSQL CI readiness (connect, authenticate, query, scratch-db privilege)
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://mep_test:mep_test_password@localhost:5432/mep_test_db
        run: python scripts/postgres_ci_gate.py preflight

      # The postgres-marked suite includes its own migration upgrade/
      # downgrade/round-trip and scratch-database tests (see
      # tests/test_postgres_integration.py); POSTGRES_TEST_DATABASE_URL is
      # the same environment variable those tests already read locally.
      - name: Run backend tests (PostgreSQL-marked)
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://mep_test:mep_test_password@localhost:5432/mep_test_db
        run: python -m pytest -q -m postgres --junitxml=postgres-results.xml

      # Defense in depth alongside the preflight step above: fails CI if any
      # postgres-marked test was skipped or errored for any reason, since every
      # pytest.skip() in that suite signals unusable infrastructure, never an
      # intentional exclusion.
      - name: Verify zero postgres tests were skipped
        run: python scripts/postgres_ci_gate.py assert-no-skips postgres-results.xml

  migrations:
    name: Alembic migration upgrade validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mep_migration_ci
          POSTGRES_USER: mep_test
          POSTGRES_PASSWORD: mep_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mep_test -d mep_migration_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # A standalone, single-purpose gate distinct from the exhaustive
      # postgres-marked pytest suite above: proves every migration in
      # alembic/versions/ applies cleanly, in order, to a fresh database.
      # Downgrade/round-trip/rollback behavior for individual migrations is
      # already covered by the dedicated tests in backend-postgres-tests.
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://mep_test:mep_test_password@localhost:5432/mep_migration_ci
        run: python -m alembic upgrade head

  backend-docker-smoke-test:
    name: Backend production Docker image (build + runtime smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mep_smoke_db
          POSTGRES_USER: mep_smoke
          POSTGRES_PASSWORD: mep_smoke_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mep_smoke -d mep_smoke_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Roadmap PR18D review 4838921407 round 1 (H4): the production image
      # (which installs the WeasyPrint native Pango/HarfBuzz packages, see
      # backend/Dockerfile) was previously never actually built anywhere in
      # CI -- backend-tests/backend-postgres-tests install
      # requirements.txt directly on the runner, not via the Dockerfile.
      - name: Build production image
        run: docker build -t mep-backend:ci ./backend

      # Round 2 (H2): a build-only smoke test cannot prove the native
      # runtime dependencies and embedded fonts actually work -- only
      # running the real image and exercising the PDF path can. `--network
      # host` (Linux runners only) puts this container directly on the
      # runner's network namespace, so it reaches the `postgres` service
      # container on `localhost:5432` the same way every other job's steps
      # do, with no extra Docker network to define.
      - name: Start production container
        run: |
          docker run -d --name mep-backend-smoke --network host \
            -e DATABASE_URL=postgresql+asyncpg://mep_smoke:mep_smoke_password@localhost:5432/mep_smoke_db \
            -e CACHE_ENABLED=false \
            mep-backend:ci

      # Proves the container actually boots and serves HTTP -- if
      # WeasyPrint's native Pango/HarfBuzz libraries or the embedded font
      # files (both loaded at module-import time by
      # app.services.report_pdf_service) were missing or broken in this
      # image, the app would fail to import and never reach this endpoint
      # at all. /api/v1/health itself tolerates a not-yet-migrated database
      # (it catches its own DB check's exception), so this only proves the
      # process is up, not yet that the schema exists.
      - name: Wait for the container to serve HTTP
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "Container is serving HTTP after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become ready in time"
          docker logs mep-backend-smoke
          exit 1

      # Same image, same entrypoint's own dependencies (alembic, the app's
      # models) -- run as a one-off command inside the already-running
      # container rather than a second container, so this exercises the
      # exact filesystem/packages the running server itself has.
      - name: Apply migrations inside the container
        run: docker exec mep-backend-smoke python -m alembic upgrade head

      # app.scripts.seed (already used for local/demo setup, per
      # docs/06-deployment-guide.md's own documented deployment sequence)
      # creates the ADMIN001 user this smoke test logs in as, plus enough
      # equipment rows that the Equipment Verify Checklist PDF below has
      # real, non-empty Thai content to render -- not just an empty-result
      # PDF. Roadmap PR18D review round 3 (H2): this step used to fail here
      # because migration 0009 (role_consolidation) already creates the
      # confirmed roles -- including "administrator" -- as part of a plain
      # `alembic upgrade head` on a fresh database, and this script
      # unconditionally re-inserted them; `seed_reference_data` now reuses
      # any pre-existing role/admin row instead (see
      # backend/app/scripts/seed.py and
      # backend/tests/test_seed_idempotency.py), which is what actually
      # makes this exact, documented alembic-then-seed sequence work at
      # all, not just this smoke test.
      - name: Seed minimal data inside the container
        run: docker exec mep-backend-smoke python -m app.scripts.seed

      - name: Log in and request a PDF export end to end
        run: |
          token=$(curl -sf -X POST http://localhost:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"identifier": "ADMIN001", "password": "Admin@12345"}' | jq -r '.access_token')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Login did not return an access token"
            docker logs mep-backend-smoke
            exit 1
          fi

          http_status=$(curl -sf -o smoke.pdf -D smoke-headers.txt -w "%{http_code}" \
            http://localhost:8000/api/v1/reports/equipment-verify-checklist/pdf \
            -H "Authorization: Bearer $token")

          echo "HTTP status: $http_status"
          test "$http_status" = "200"

          grep -qi '^content-type: application/pdf' smoke-headers.txt

          header_bytes=$(head -c 5 smoke.pdf)
          test "$header_bytes" = "%PDF-"

          body_size=$(wc -c < smoke.pdf)
          echo "Response body size: ${body_size} bytes"
          test "$body_size" -gt 1000

          echo "Production image PDF smoke test passed: HTTP 200, application/pdf, valid %PDF- header, non-trivial body (${body_size} bytes)"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs mep-backend-smoke

      # Cleanup runs even if an earlier step failed, so a failed smoke test
      # never leaves a container running on the runner.
      - name: Stop and remove the container
        if: always()
        run: docker rm -f mep-backend-smoke || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (npm ci)
        run: npm ci

      # Roadmap PR8B (knowledge/adr/ADR-006-receipt-outcome-contract.md):
      # Vitest + React Testing Library, added because none existed before
      # (docs/development/TESTING.md). Runs before the build so a test
      # failure is reported without waiting on the slower build step.
      - name: Frontend tests
        run: npm run test

      # package.json's "build" script is `tsc -b && vite build`, so this
      # single command covers both the TypeScript check and the production
      # build, matching how this repository's Roadmap PRs already validate
      # the frontend locally.
      - name: TypeScript check and production build
        run: npm run build

  whitespace-check:
    name: git diff --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: git diff --check against base
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  powershell-validation:
    name: PowerShell script validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # PR24D-L2: ubuntu-latest GitHub-hosted runners ship pwsh
      # preinstalled -- no separate install step. This parses every
      # installer script with the real PowerShell language parser
      # (syntax only, nothing is executed) so a script that would fail to
      # load on the target Windows host is caught here rather than left
      # as untested prose. Structural checks (no Invoke-Expression, no
      # default credentials, secret-preservation behavior, etc.) live in
      # backend/tests/test_pr24d_l2_installer_scripts.py instead of being
      # duplicated here.
      - name: Parse all deployment/local-staging PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path deployment/local-staging -Filter *.ps1 -Recurse
          if ($files.Count -eq 0) {
            Write-Error "No .ps1 files found under deployment/local-staging -- expected at least install.ps1 and lib/Common.ps1."
            exit 1
          }
          $failed = $false
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "PARSE ERROR in $($file.FullName):"
              $errors | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            }
            else {
              Write-Host "OK: $($file.FullName)"
            }
          }
          if ($failed) { exit 1 }
