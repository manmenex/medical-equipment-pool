name: CI

# Roadmap infrastructure PR (pre-PR7): reliable GitHub CI checks for pull
# requests targeting the base branch. See docs/AI_REVIEW_WORKFLOW.md for how
# these checks fit into the Claude -> Codex -> owner review workflow.
#
# Every job uses test-only, hardcoded, non-secret values (POSTGRES_*,
# JWT_SECRET_KEY is left at the backend's own committed development default —
# see backend/app/core/config.py) and a PostgreSQL service container. No
# repository secret, hospital credential, or production configuration is
# read or required for this workflow to run.

on:
  pull_request:
    branches:
      - claude/medical-equipment-pool-0c7fz0

# Least privilege: this workflow only ever reads the repository and runs
# tests/builds. No job needs to write repository contents, mutate the pull
# request, use a repository secret, or auto-merge -- so the default
# GITHUB_TOKEN is read-only at the workflow level, and no job below
# overrides it with broader permissions.
permissions:
  contents: read

# Cancel a still-running run for the same PR when a new commit is pushed,
# so CI reflects only the latest reviewed head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Matches backend/Dockerfile's production image (the only explicit
  # Python version declaration in this repository).
  PYTHON_VERSION: "3.12"
  # Matches this repository's frontend/package-lock.json-resolved toolchain.
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend tests (non-PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Roadmap PR18D: WeasyPrint (the backend PDF renderer, exercised by
      # app.api.v1.reports's PDF export tests) loads Pango/HarfBuzz at
      # runtime via cffi, not via a pip wheel -- matches the native packages
      # backend/Dockerfile installs for the production image.
      - name: Install WeasyPrint native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # tests/conftest.py sets DATABASE_URL to an in-memory SQLite database
      # and CACHE_ENABLED=false via os.environ.setdefault(...) before the
      # app is imported, so no environment configuration is needed here.
      # This is the repository's documented, supported non-PostgreSQL test
      # command (see docs/PROJECT_PLAYBOOK.md evidence conventions and every
      # Roadmap PR's own evidence table).
      - name: Run backend tests (non-PostgreSQL)
        run: python -m pytest -q -m "not postgres"

  backend-postgres-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Test-only credentials, hardcoded here (not a repository secret)
          # and scoped to this ephemeral CI service container only.
          POSTGRES_DB: mep_test_db
          POSTGRES_USER: mep_test
          POSTGRES_PASSWORD: mep_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mep_test -d mep_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Roadmap PR18D: see the matching step in the backend-tests job above.
      - name: Install WeasyPrint native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # Fail closed, before pytest ever runs: tests/test_postgres_integration.py's
      # own fixtures call pytest.skip() whenever PostgreSQL is unreachable/unusable
      # or the scratch-database privilege those migration round-trip tests need is
      # missing -- so a broken service container can otherwise make the suite below
      # exit 0 via silent skips instead of failures. This does not use pg_isready:
      # pg_isready only proves the server process accepts TCP connections, not that
      # these exact credentials can authenticate, reach the configured database, or
      # create/drop a database. See scripts/postgres_ci_gate.py.
      - name: Verify PostgreSQL CI readiness (connect, authenticate, query, scratch-db privilege)
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://mep_test:mep_test_password@localhost:5432/mep_test_db
        run: python scripts/postgres_ci_gate.py preflight

      # The postgres-marked suite includes its own migration upgrade/
      # downgrade/round-trip and scratch-database tests (see
      # tests/test_postgres_integration.py); POSTGRES_TEST_DATABASE_URL is
      # the same environment variable those tests already read locally.
      - name: Run backend tests (PostgreSQL-marked)
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://mep_test:mep_test_password@localhost:5432/mep_test_db
        run: python -m pytest -q -m postgres --junitxml=postgres-results.xml

      # Defense in depth alongside the preflight step above: fails CI if any
      # postgres-marked test was skipped or errored for any reason, since every
      # pytest.skip() in that suite signals unusable infrastructure, never an
      # intentional exclusion.
      - name: Verify zero postgres tests were skipped
        run: python scripts/postgres_ci_gate.py assert-no-skips postgres-results.xml

  migrations:
    name: Alembic migration upgrade validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mep_migration_ci
          POSTGRES_USER: mep_test
          POSTGRES_PASSWORD: mep_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mep_test -d mep_migration_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # A standalone, single-purpose gate distinct from the exhaustive
      # postgres-marked pytest suite above: proves every migration in
      # alembic/versions/ applies cleanly, in order, to a fresh database.
      # Downgrade/round-trip/rollback behavior for individual migrations is
      # already covered by the dedicated tests in backend-postgres-tests.
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://mep_test:mep_test_password@localhost:5432/mep_migration_ci
        run: python -m alembic upgrade head

  backend-docker-build:
    name: Backend production Docker image (smoke build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Roadmap PR18D review 4838921407 (H4): the production image (which
      # now installs the WeasyPrint native Pango/HarfBuzz packages, see
      # backend/Dockerfile) was previously never actually built anywhere in
      # CI -- backend-tests/backend-postgres-tests install
      # requirements.txt directly on the runner, not via the Dockerfile.
      # This is a smoke build only: it proves the image builds successfully
      # end to end (apt layer, pip install, non-root user setup); it does
      # not run or deploy the resulting container.
      - name: Build production image
        run: docker build -t mep-backend:ci ./backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (npm ci)
        run: npm ci

      # Roadmap PR8B (knowledge/adr/ADR-006-receipt-outcome-contract.md):
      # Vitest + React Testing Library, added because none existed before
      # (docs/development/TESTING.md). Runs before the build so a test
      # failure is reported without waiting on the slower build step.
      - name: Frontend tests
        run: npm run test

      # package.json's "build" script is `tsc -b && vite build`, so this
      # single command covers both the TypeScript check and the production
      # build, matching how this repository's Roadmap PRs already validate
      # the frontend locally.
      - name: TypeScript check and production build
        run: npm run build

  whitespace-check:
    name: git diff --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: git diff --check against base
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
