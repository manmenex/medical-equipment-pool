# Production overrides for docker-compose.yml. The frontend/nginx.conf shipped
# in this repo only terminates plain HTTP (port 80) for local/dev use — before
# using this file, add a TLS server block (listen 443 ssl; certs mounted below)
# to frontend/nginx.conf, matched to your hospital's certificate setup.
services:
  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    deploy:
      # PR24B (docs/design/PR24_PRODUCTION_DEPLOYMENT_GO_LIVE_PLAN.md
      # §15/§15A/§28): must stay 1. The embedded APScheduler
      # (app/worker/scheduler.py) has no leader-election guard --
      # replicas > 1 would duplicate the daily PM/CAL notification job.
      # This is a hard deployment invariant until scheduler leadership
      # is redesigned in a future slice, not a tunable for throughput;
      # backend/Dockerfile's own `--workers` flag carries the same
      # invariant for the single-process case.
      replicas: 1
      restart_policy:
        condition: on-failure
    ports: []

  frontend:
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro

  postgres:
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    ports: []
    command: redis-server --appendonly yes

volumes:
  postgres_data:
