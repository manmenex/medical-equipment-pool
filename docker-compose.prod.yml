# Production overrides for docker-compose.yml. The frontend/nginx.conf shipped
# in this repo only terminates plain HTTP (port 80) for local/dev use — before
# using this file, add a TLS server block (listen 443 ssl; certs mounted below)
# to frontend/nginx.conf, matched to your hospital's certificate setup.
services:
  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    ports: []

  frontend:
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro

  postgres:
    ports: []
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    ports: []
    command: redis-server --appendonly yes

volumes:
  postgres_data:
